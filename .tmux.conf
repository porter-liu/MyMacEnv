# Enable mouse support for selecting panes, resizing panes, switching windows, and scrolling through pane history.
set -g mouse on

# Preserve modified key combinations, such as Shift+Enter, Alt+Enter, and Ctrl+Enter, for programs running inside tmux.
set -g extended-keys on

# Keep up to 500,000 lines of scrollback history for each pane.
set -g history-limit 500000


# Start window numbering at 1 instead of the default 0.
set -g base-index 1

# Start pane numbering at 1 instead of the default 0.
setw -g pane-base-index 1

# Automatically renumber windows after one is closed, so the window numbers remain sequential.
set -g renumber-windows on


# Reduce the delay tmux uses when distinguishing the Escape key from longer key sequences. This makes Vim and terminal apps feel faster.
set -sg escape-time 10


# Advertise tmux as a modern 256-color terminal to applications running inside tmux.
set -g default-terminal "tmux-256color"


# Split the current window horizontally and start the new pane in the same working directory as the active pane.
bind % split-window -h -c "#{pane_current_path}"

# Split the current window vertically and start the new pane in the same working directory as the active pane.
bind '"' split-window -v -c "#{pane_current_path}"


# Refresh the tmux status bar every 2 seconds. This also controls how quickly directory changes appear in window labels.
set -g status-interval 2


# Use the Catppuccin Mocha color palette.
set -g @catppuccin_flavor "mocha"

# Use rounded decorations for window entries in the status bar.
set -g @catppuccin_window_status_style "rounded"

# Display the active pane's working directory in inactive window labels.
# Show "~" when the pane is in the home directory.
# Otherwise, show only the final two path components.
set -g @catppuccin_window_text ' #{?#{==:#{pane_current_path},#{HOME}},~,#{s|^.*/([^/]+/[^/]+)$|\1|:pane_current_path}}'

# Display the active pane's working directory in the current window label.
# Show "~" when the pane is in the home directory.
# Otherwise, show only the final two path components.
set -g @catppuccin_window_current_text ' #{?#{==:#{pane_current_path},#{HOME}},~,#{s|^.*/([^/]+/[^/]+)$|\1|:pane_current_path}}'


# Load the Catppuccin tmux theme after all Catppuccin options have been configured.
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# Allow the right side of the status bar to use up to 100 characters.
set -g status-right-length 100

# Allow the left side of the status bar to use up to 100 characters.
set -g status-left-length 100

# Hide all content from the left side of the status bar.
set -g status-left ""

# Show the current application or command on the right side using Catppuccin's application status module.
set -g status-right "#{E:@catppuccin_status_application}"

# Append the current tmux session name to the right side using Catppuccin's session status module.
set -ag status-right "#{E:@catppuccin_status_session}"

# Current hostname
set -agF status-right "#{E:@catppuccin_status_host}"
